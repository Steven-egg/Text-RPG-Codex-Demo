<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon Exploration Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="exploration-shell" data-load-state="loading">
      <header class="exploration-header">
        <div class="title-copy">
          <p class="screen-label">探索畫面</p>
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/dungeon-exploration-default.json">Default Exploration</option>
            <option value="./fixtures/dungeon-exploration-encounter.json">Fixed Encounter Preview</option>
          </select>
        </div>
      </header>

      <section id="resource-strip" class="resource-strip" aria-label="Player resources"></section>

      <main class="exploration-layout">
        <section class="dungeon-stage" aria-label="Dungeon scene">
          <div class="dungeon-art" aria-hidden="true">
            <div class="scene-layer scene-back"></div>
            <div class="scene-layer scene-arches"></div>
            <div class="scene-layer scene-path"></div>
            <div class="scene-layer scene-runes"></div>
            <div class="scene-layer scene-fog"></div>
          </div>

          <div class="stage-overlay">
            <section class="location-card" aria-label="Dungeon summary">
              <p class="panel-label">目前地點</p>
              <h2 id="location-name"></h2>
              <p id="location-summary"></p>
              <div id="location-meta" class="meta-grid"></div>
            </section>
          </div>
        </section>

        <aside class="side-panel" aria-label="Exploration status">
          <section class="run-card" aria-label="Current run status">
            <p class="panel-label">探索狀態</p>
            <div class="step-meter">
              <div>
                <strong id="step-label"></strong>
                <span id="step-detail"></span>
              </div>
              <span class="meter-track" aria-hidden="true">
                <span id="step-fill" class="meter-fill"></span>
              </span>
            </div>
            <div id="run-stats" class="run-stats"></div>
          </section>

          <section class="panel-card">
            <p class="panel-label">本趟收益</p>
            <div id="reward-summary" class="reward-list"></div>
          </section>

          <section class="panel-card log-preview-card">
            <p class="panel-label">最新事件</p>
            <div id="event-preview" class="event-preview"></div>
          </section>
        </aside>
      </main>

      <footer class="exploration-footer">
        <section class="message-panel" aria-live="polite">
          <p class="panel-label">探索敘事</p>
          <p id="narrative-message"></p>
        </section>
        <div id="action-row" class="action-row" aria-label="Exploration actions"></div>
      </footer>

      <section class="action-log-panel">
        <div class="action-log-heading">
          <p class="panel-label">UIAction Log</p>
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </section>
    </div>

    <script type="module" src="./dungeon-exploration.js"></script>
  </body>
</html>
