<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>《元素迷宮：邊境冒險者》轉職神殿</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="facility-body">
    <div class="temple-shell" data-load-state="loading">

      <!-- 頂部 JRPG HUD Bar -->
      <header class="hud-bar">
        <div class="hud-title-area">
          <div class="title-copy">
            <h1 id="screen-title" class="hud-location-name">轉職神殿 (Temple & Church)</h1>
            <p id="screen-subtitle" class="hud-subtitle" style="display: none;"></p>
          </div>
        </div>

        <!-- HP, MP, Gold Resource Strip (Released for visual parity) -->
        <div id="resource-strip" class="hud-resources" aria-label="Player Stats">
          <!-- Renders dynamically from JS: HP, MP, Gold -->
        </div>

        <div class="fixture-switcher-container" style="display: none;">
          <div class="fixture-switcher" aria-label="Fixture state">
            <label for="fixture-select">測試狀態</label>
            <select id="fixture-select">
              <option value="./fixtures/temple-default.json">Default Temple</option>
            </select>
          </div>
        </div>
      </header>

      <!-- 中間 JRPG 大舞台 (Main Stage) -->
      <main class="main-stage">
        <!-- 教堂神聖光影 -->
        <div class="church-glow"></div>
        <div class="stained-glass-light"></div>

        <!-- 教堂紅框內容隱藏以防 JS 報錯 -->
        <div style="display: none;">
          <!-- 左側欄：聖痕與線索詢問面板 (Inquiries Panel) -->
          <section class="inquiries-panel">
            <div id="inquiries-container" class="inquiries-list"></div>
            <div id="inquiry-feedback"></div>
          </section>

          <!-- 中間欄：月神之井祭壇 (Moon Well Card) -->
          <section class="moon-well-card">
            <h3 id="well-name">月神之井</h3>
            <p id="well-description"></p>
            <button id="draw-wellwater-btn" type="button"></button>
            <div id="well-feedback"></div>
          </section>

          <!-- NPC 艾莉希亞形象展示區 -->
          <div class="npc-stage-presence">
            <div class="npc-portrait-container">
              <div class="npc-avatar-plate">EL</div>
            </div>
          </div>
        </div>
      </main>

      <!-- 底部 JRPG 對話與行動面板 -->
      <footer class="jrpg-footer-bar">
        <!-- 左側：次要行動按鈕區 -->
        <div class="footer-left-action">
          <button onclick="document.getElementById('back-to-town').click()" class="action-btn secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
          <button id="back-to-town" style="display: none;" type="button"></button>
        </div>

        <!-- 中間：對話框 (Dialogue Box) -->
        <section class="dialogue-box">
          <div class="speaker-name" id="npc-name">艾莉希亞</div>
          <div class="dialogue-content-area">
            <p id="npc-bubble" class="speech-bubble">願聖光指引你的道路，旅人。需要教會的協助嗎？</p>
            <p id="feedback-message" class="feedback-message"></p>

            <!-- 隱藏的舊詢問按鈕與轉職按鈕，保持 JS 相容性 -->
            <button id="open-inquiries-btn" style="display: none;" type="button"></button>
            <button id="open-promotions-btn" style="display: none;" type="button"></button>
          </div>
          <div class="speech-arrow">▼</div>
        </section>

        <!-- 神殿指引選項選單 (垂直排列之黃金按鈕，置於右側按鈕上方) -->
        <div id="temple-guide-menu" class="dialogue-choices" style="display: none;">
          <button class="choice-btn" type="button" onclick="document.getElementById('open-promotions-btn').click(); document.getElementById('temple-guide-menu').style.display = 'none';">職業晉升</button>
          <button class="choice-btn" type="button" onclick="document.getElementById('open-inquiries-btn').click(); document.getElementById('temple-guide-menu').style.display = 'none';">聖痕諮詢</button>
          <button class="choice-btn" type="button" onclick="document.getElementById('temple-guide-menu').style.display = 'none';">取消</button>
        </div>

        <!-- 右側：主要行動按鈕區 -->
        <div class="footer-right-action">
          <button onclick="const m = document.getElementById('temple-guide-menu'); m.style.display = (m.style.display === 'none' ? 'flex' : 'none');" class="action-btn primary-action active" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.99L19.53 19H4.47L12 5.99zM13 16h-2v2h2v-2zm0-6h-2v4h2v-4z" fill="currentColor"/></svg>
            <span class="btn-text">尋求指引</span>
          </button>
        </div>
      </footer>

      <!-- 彈窗對話框 2：轉職祭壇預覽 (Promotions Modal) -->
      <div id="promotions-modal" class="jrpg-modal-overlay" style="display: none;">
        <div class="jrpg-modal-content">
          <header class="modal-header">
            <h2>職業晉升祭壇 (預覽)</h2>
            <button id="close-promotions-btn" class="close-btn" type="button" aria-label="Close">×</button>
          </header>
          <div class="modal-body">
            <p class="modal-instruction">晉升二階職業將解鎖強大技能與全新屬性特化（目前僅供預覽）。</p>
            <div id="promotions-container" class="promotions-list">
              <!-- Renders promotion cards dynamically from JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Collapsible UIAction Log Panel for Verification (Hidden in production styling) -->
      <section class="action-log-panel" style="display: none;">
        <details>
          <summary class="action-log-heading">
            <span class="panel-label">UIAction Log (Debug)</span>
            <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
          </summary>
          <ol id="action-log" class="action-log"></ol>
        </details>
      </section>
    </div>

    <script type="module" src="./temple-screen.js"></script>
  </body>
</html>
