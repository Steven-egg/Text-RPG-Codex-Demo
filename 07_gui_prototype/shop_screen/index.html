<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop Screen Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="shop-shell" data-load-state="loading">
      <header class="shop-header">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/shop-default.json">Default Shop (正常購買)</option>
            <option value="./fixtures/shop-constrained.json">Constrained Shop (受限狀態)</option>
          </select>
        </div>
      </header>

      <div id="resource-strip" class="resource-strip" aria-label="Player Stats"></div>

      <main class="shop-layout">
        <section class="item-browser" aria-label="Item list">
          <div class="category-tabs" id="category-tabs"></div>
          <div class="item-list" id="item-list"></div>
        </section>

        <section class="item-detail-area" aria-live="polite">
          <section class="item-detail-card">
            <div class="detail-heading">
              <p class="panel-label">商品詳情</p>
              <span id="detail-status" class="status-badge"></span>
            </div>
            <div id="item-detail" class="item-detail"></div>
          </section>

          <section class="requirement-panel">
            <p class="panel-label">購買要求與限制</p>
            <div id="requirement-list" class="requirement-list"></div>
          </section>
        </section>
      </main>

      <aside class="shopkeeper-side" aria-label="Shopkeeper">
        <section class="npc-region">
          <div class="npc-portrait" id="npc-portrait" aria-hidden="true"></div>
          <div class="npc-copy">
            <p class="panel-label">行商</p>
            <h2 id="npc-name"></h2>
            <p id="npc-role" class="npc-role"></p>
          </div>
        </section>
      </aside>

      <footer class="shop-footer">
        <div class="footer-left-action">
          <button id="back-action" class="secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" id="feedback-speaker">提示</div>
          <div class="dialogue-content-area">
            <p id="feedback-message" class="speech-bubble"></p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="primary-action" class="primary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="currentColor"/></svg>
            <span class="btn-text">購買項目</span>
          </button>
        </div>
      </footer>

      <details class="action-log-panel">
        <summary class="panel-label">UIAction Log</summary>
        <div class="action-log-heading">
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </details>
    </div>

    <script type="module" src="./shop-screen.js"></script>
  </body>
</html>
