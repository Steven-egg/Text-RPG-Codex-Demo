<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guild Screen Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body class="facility-body">
    <div class="guild-shell" data-load-state="loading">
      <header class="guild-header">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/guild-default.json">Default Board</option>
            <option value="./fixtures/guild-quest-ready.json">Quest Ready / Fire Mark</option>
          </select>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Resource Strip"></section>

      <main class="guild-layout">
        <section class="npc-region" aria-label="Guild receptionist">
          <div class="npc-portrait" id="npc-portrait" aria-hidden="true"></div>
          <div class="npc-copy">
            <p class="panel-label">接待員</p>
            <h2 id="npc-name"></h2>
            <p id="npc-role"></p>
          </div>
        </section>

        <section class="task-board" aria-label="Quest board">
          <div class="mode-tabs" id="guild-mode-tabs">
            <button id="mode-tasks-btn" class="mode-tab-button is-active" type="button">委託任務</button>
            <button id="mode-sell-btn" class="mode-tab-button" type="button">素材收購</button>
          </div>
          <div class="tasks-view-container" id="tasks-view-container">
            <div class="filter-row" id="task-filters"></div>
            <div class="story-hint-slot" id="story-hint-slot"></div>
            <div class="task-list" id="task-list"></div>
          </div>
          <div class="sell-view-container" id="sell-view-container" style="display: none;">
            <div class="task-list material-list" id="material-sell-list"></div>
          </div>
        </section>

        <section class="task-detail-area" aria-live="polite">
          <div id="tasks-detail-container" style="display: contents;">
            <div class="detail-card task-detail-card">
              <p class="panel-label">委託詳情</p>
              <div id="task-detail"></div>
            </div>

            <div class="detail-grid">
              <section class="detail-card rewards-card">
                <p class="panel-label">任務報酬</p>
                <div id="reward-summary"></div>
              </section>

              <section class="detail-card conditions-card">
                <p class="panel-label">回報條件</p>
                <div id="condition-list"></div>
              </section>
            </div>
          </div>

          <div id="sell-detail-container" style="display: none;">
            <div class="detail-card task-detail-card">
              <p class="panel-label">素材詳情</p>
              <div id="sell-material-detail"></div>
            </div>

            <div class="detail-grid">
              <section class="detail-card rewards-card">
                <p class="panel-label">預計獲得</p>
                <div id="sell-reward-summary"></div>
              </section>

              <section class="detail-card conditions-card">
                <p class="panel-label">出售確認</p>
                <div id="sell-confirm-container"></div>
              </section>
            </div>
          </div>
        </section>
      </main>

      <footer class="guild-footer">
        <div class="footer-left-action">
          <button id="back-action" class="secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" id="feedback-speaker">諾亞</div>
          <div class="dialogue-content-area">
            <p id="feedback-message" class="speech-bubble"></p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="primary-action" class="primary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/></svg>
            <span class="btn-text">進行操作</span>
          </button>
        </div>
      </footer>

      <section class="action-log-panel">
        <div class="action-log-heading">
          <p class="panel-label">UIAction Log</p>
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </section>
    </div>

    <script type="module" src="./guild-screen.js"></script>
  </body>
</html>
