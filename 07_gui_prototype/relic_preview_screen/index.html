<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relics Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/sfx.css" />
  </head>
  <body class="facility-body">
    <div class="relic-shell" data-load-state="loading">
      <header class="title-area">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Fixture state">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/relic-preview-default.json">Default Relics</option>
          </select>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Resources"></section>

      <main class="relic-layout">
        <!-- 左側：四元素聖印插槽清單 -->
        <section class="slots-card" aria-label="Elemental Slots">
          <p class="panel-label">四元素聖印</p>
          <div id="slots-container" class="slots-list"></div>
        </section>

        <!-- 中央：聖物核心特寫與魔能操作 -->
        <section class="focus-card" aria-label="Relic Focus">
          <p class="panel-label">魔能核心特寫</p>
          <div class="focus-detail">
            <h2 id="focus-title">請選擇遺物</h2>
            <p id="focus-subtitle" class="focus-subtitle-label"></p>
            <div class="focus-orb-area">
              <div id="orb-visual" class="orb-visual" data-element="none"></div>
            </div>
          </div>
        </section>

        <!-- 右側：古代石碑解譯與被動加成 -->
        <section class="tablet-card" aria-label="Tablet Translation">
          <p class="panel-label">古代石碑與被動效果</p>
          <div class="tablet-detail">
            <h3>古代碑文譯本</h3>
            <p id="tablet-translation-text" class="tablet-text"></p>
            <div class="passive-area" aria-live="polite">
              <h3>聖印被動</h3>
              <p id="passive-status-text" class="tablet-text"></p>
              <div id="passive-choices" class="passive-choices"></div>
            </div>
            <div class="disclaimer-area">
              <p>※ 聖印同時是主線進度與既有被動系統：安置後可在此免費選擇或改選，被動效果會由 Python 核心立即套用。</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="relic-footer">
        <div class="footer-left-action">
          <button id="back-to-town" class="back-btn" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" hidden>聖物祭壇</div>
          <div class="dialogue-content-area">
            <p id="focus-feedback" class="speech-bubble"></p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="attune-relic-btn" class="primary-action" type="button" disabled>
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" fill="currentColor"/></svg>
            <span class="btn-text">進行共鳴</span>
          </button>
        </div>
      </footer>

      <section class="action-log-panel">
        <div class="action-log-heading">
          <p class="panel-label">UIAction Log</p>
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </section>
    </div>

    <script type="module" src="./relic-preview-screen.js"></script>
    <script type="module" src="../shared/sfx.js"></script>
  </body>
</html>
