<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synthesis Screen Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body class="facility-body">
    <div class="synthesis-shell" data-load-state="loading">
      <header class="synthesis-header">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/synthesis-default.json">Default Craftable</option>
            <option value="./fixtures/synthesis-constrained.json">Constrained / Missing</option>
          </select>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Resources" hidden></section>

      <main class="synthesis-layout">
        <section class="recipe-browser" aria-label="Recipe list">
          <div class="category-tabs" id="category-tabs"></div>
          <div class="recipe-list" id="recipe-list"></div>
        </section>

        <section class="recipe-detail-area" aria-live="polite">
          <section class="recipe-detail-card">
            <div class="detail-heading">
              <p class="panel-label">配方詳情</p>
              <span id="detail-status" class="status-badge"></span>
            </div>
            <div id="recipe-detail" class="recipe-detail"></div>
            <div id="output-summary" class="output-summary"></div>
          </section>

          <section class="requirement-panel">
            <p class="panel-label">需求與缺口</p>
            <div id="requirement-list" class="requirement-list"></div>
          </section>
        </section>

        <aside class="workshop-side" aria-label="Workshop character">
          <section class="npc-region">
            <div class="npc-portrait" id="npc-portrait" aria-hidden="true"></div>
            <div class="npc-copy">
              <p class="panel-label">工房主人</p>
              <h2 id="npc-name"></h2>
              <p id="npc-role" class="npc-role"></p>
            </div>
          </section>
        </aside>
      </main>

      <footer class="synthesis-footer">
        <div class="footer-left-action">
          <button id="back-action" class="secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" id="feedback-speaker">米菈</div>
          <div class="dialogue-content-area">
            <p id="feedback-message" class="speech-bubble"></p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="primary-action" class="primary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 6h-2v2h2v2h-2v2h-2v-2H9v-2h2V9H9V7h2V5h2v2h2v2z" fill="currentColor"/></svg>
            <span class="btn-text">開始合成</span>
          </button>
        </div>
      </footer>

      <details class="action-log-panel">
        <summary class="panel-label">UIAction Log</summary>
        <div class="action-log-heading">
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </details>
    </div>

    <script type="module" src="./synthesis-screen.js"></script>
  </body>
</html>
