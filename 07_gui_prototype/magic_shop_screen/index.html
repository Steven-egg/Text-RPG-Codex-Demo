<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Shop Screen Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body class="facility-body">
    <div class="magic-shop-shell" data-load-state="loading">
      <!-- Top Header -->
      <header class="magic-shop-header">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/magic-shop-default.json">Default (正常研讀學習)</option>
            <option value="./fixtures/magic-shop-discount.json">Discount (完成魔晶研究折價)</option>
            <option value="./fixtures/magic-shop-constrained.json">Constrained (金幣/素材/職業限制)</option>
            <option value="./fixtures/magic-shop-learned.json">Learned (魔法已全學會)</option>
          </select>
        </div>
      </header>

      <!-- Player Resources Strip -->
      <section class="resource-strip" id="resource-strip" aria-label="Resource Strip"></section>

      <!-- Main Layout -->
      <main class="magic-shop-layout">
        <!-- Left Column: Spellbooks Browser -->
        <section class="item-browser" aria-label="Spellbook list">
          <div class="category-tabs-container">
            <div class="category-tabs" id="category-tabs">
              <!-- Category Tabs Rendered via JS -->
            </div>
          </div>
          <div class="item-list" id="spellbook-list">
            <!-- Spellbook list rows Rendered via JS -->
          </div>
        </section>

        <!-- Center Column: Scroll Detail & Requirements -->
        <section class="item-detail-area" aria-label="Spellbook details">
          <!-- Spell details card -->
          <article class="item-detail-card" id="detail-card">
            <div class="detail-heading">
              <span class="panel-label">魔法書傳承詳情</span>
              <span id="detail-status-badge" class="status-badge"></span>
            </div>
            
            <div class="item-detail" id="item-detail-content">
              <!-- Rendered via JS -->
            </div>

            <!-- Price pill at details footer -->
            <div class="price-summary" id="detail-price-summary">
              <div class="price-pill" id="detail-price-pill">
                <span>價格:</span>
                <strong id="detail-price-text">--</strong>
              </div>
            </div>
          </article>

          <!-- Requirements Panel -->
          <section class="requirement-panel" aria-label="Learning requirements">
            <h3 class="panel-label">學習條件判定</h3>
            <div class="requirement-list" id="requirement-list">
              <!-- Requirements Rows Rendered via JS -->
            </div>
          </section>
        </section>

        <!-- Right Column: Eve NPC Region -->
        <section class="shopkeeper-side" aria-label="Eve character presence">
          <div class="npc-region">
            <div class="npc-portrait" id="npc-portrait" data-npc-placeholder="EV">
              <!-- Portrayed via CSS star background -->
            </div>
            <div class="npc-copy">
              <h2 id="npc-name">伊芙</h2>
              <p id="npc-role" class="npc-role">魔法商店館長</p>
            </div>
          </div>
        </section>
      </main>

      <!-- Bottom Footer Bar -->
      <footer class="magic-shop-footer">
        <div class="footer-left-action">
          <button id="back-action" class="secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" id="feedback-speaker">伊芙</div>
          <div class="dialogue-content-area">
            <p id="feedback-message" class="speech-bubble">「願星辰指引你的靈魂，冒險者。選中魔法書可開始研讀。」</p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="primary-action" class="primary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.2 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z" fill="currentColor"/></svg>
            <span class="btn-text">學習魔法</span>
          </button>
        </div>
      </footer>

      <!-- Collapsible UIAction Log Panel -->
      <details class="action-log-panel">
        <summary class="panel-label">UIAction Log</summary>
        <div class="action-log-heading">
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </details>
    </div>

    <script type="module" src="./magic-shop-screen.js"></script>
  </body>
</html>
