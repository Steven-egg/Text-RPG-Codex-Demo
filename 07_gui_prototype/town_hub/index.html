<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>《元素迷宮：邊境冒險者》城鎮中樞</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="town-hub-shell" data-load-state="loading">
      <header class="title-area">
        <div class="title-copy">
          <div class="title-row">
            <p class="screen-label">城鎮中樞</p>
            <span id="live-status-badge" class="live-status-badge" style="display: none;">● LIVE</span>
          </div>
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Resources"></section>

      <main class="town-layout">
        <section class="scene-facility-node-area" id="facility-scene" aria-label="Facilities">
          <div class="scene-layer scene-sky"></div>
          <div class="scene-layer scene-rooftops"></div>
          <div class="scene-layer scene-streets"></div>
          <div class="facility-node-layer" id="facility-node-layer"></div>
        </section>
      </main>

      <footer class="town-footer">
        <section class="town-guidance-area">
          <p class="panel-label">城鎮提示</p>
          <div id="town-guidance"></div>
        </section>

        <section class="world-map-nav-area">
          <div id="navigation-actions" class="action-row"></div>
        </section>
      </footer>

      <!-- 偵錯主控台容器：只在 ?debug=1 時顯示 -->
      <section id="debug-container" class="debug-container" style="display: none;">
        <div class="debug-header">
          <div class="debug-header-title-row">
            <span class="debug-title">⚙️ 偵錯主控台</span>
            <span id="debug-mode-badge" class="debug-badge">讀取中...</span>
          </div>
          <button id="toggle-debug-collapse" class="quiet-button" type="button">收合</button>
        </div>
        <div class="debug-body" id="debug-body">
          <div class="debug-control-group">
            <div class="debug-control-item">
              <label for="fixture-select">測試數據 (Fixture)</label>
              <select id="fixture-select">
                <option value="./fixtures/town-hub-default.json">預設城鎮狀態</option>
                <option value="./fixtures/town-hub-alerts.json">鎖定與提示狀態</option>
                <option value="./fixtures/town-hub-regional-slots.json">Regional Slot Shell</option>
              </select>
            </div>
            <div class="debug-control-item">
              <span class="debug-label">備忘筆記 (Debug Notes)：</span>
              <ul id="debug-notes" class="debug-notes-list"></ul>
            </div>
          </div>
          <div class="action-log-panel">
            <div class="action-log-heading">
              <p class="panel-label">UIAction Log</p>
              <div class="action-log-controls">
                <button id="toggle-log-visible" class="quiet-button" type="button">隱藏 Log</button>
                <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
              </div>
            </div>
            <ol id="action-log" class="action-log"></ol>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="./town-hub.js"></script>
  </body>
</html>
