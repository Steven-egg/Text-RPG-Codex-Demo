<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storage Screen Static Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body class="facility-body">
    <div class="storage-shell" data-load-state="loading">
      <header class="storage-header">
        <div class="title-copy">
          <h1 id="screen-title">Loading</h1>
          <p id="screen-subtitle" class="subtitle"></p>
        </div>
        <div class="fixture-switcher" aria-label="Prototype fixture">
          <label for="fixture-select">測試狀態</label>
          <select id="fixture-select">
            <option value="./fixtures/storage-locked.json">Storage Locked (未開啟倉庫)</option>
            <option value="./fixtures/storage-empty.json">Storage Empty (已開啟但倉庫空)</option>
            <option value="./fixtures/storage-filled.json">Storage Filled (正常存取測試)</option>
            <option value="./fixtures/storage-blocked.json">Storage Blocked (各種受限展示)</option>
          </select>
        </div>
      </header>

      <section class="resource-strip" id="resource-strip" aria-label="Resource Strip"></section>

      <main class="storage-layout">
        <!-- Backpack Browser Column (List-based with filters) -->
        <section class="list-browser inventory-browser" aria-label="Backpack list">
          <div class="column-heading">
            <h2>我的背包行囊</h2>
          </div>
          <div class="category-tabs-container">
            <div class="category-tabs" id="backpack-tabs">
              <!-- Rendered via JS -->
            </div>
          </div>
          <div class="item-list-container">
            <div class="item-list" id="inventory-item-list">
              <!-- Rendered via JS as item rows -->
            </div>
          </div>
        </section>

        <!-- Center Warehouse Stage Column (Capacity + Detail + Controls + NPC) -->
        <section class="center-stage" aria-label="Warehouse center stage">
          <!-- Capacity strip -->
          <section class="capacity-stage-card">
            <div class="capacity-heading">
              <span class="panel-label">工會保管箱資訊</span>
              <span id="storage-status-badge" class="status-badge"></span>
            </div>
            <div class="capacity-bar-row">
              <div class="capacity-bar-bg">
                <div class="capacity-bar-fill" id="capacity-bar-fill" style="width: 0%;"></div>
              </div>
              <span id="capacity-text" class="capacity-text">容量: 0 / 10</span>
            </div>
          </section>

          <!-- Inline Transfer Action Panel (Detail & Controls combined) -->
          <section class="transfer-action-panel" id="transfer-action-panel" aria-live="polite">
            <!-- Empty State (Shown by default) -->
            <div id="transfer-empty-state" class="empty-state">
              <p>選擇左側背包物品 (存入)</p>
              <p>或右側倉庫物品 (取出)</p>
              <p class="empty-sub">即可進行物品整理</p>
            </div>

            <!-- Active control content (Hidden by default) -->
            <div id="transfer-control-content" style="display: none;">
              <div class="transfer-header">
                <h3 id="transfer-item-name">鐵礦石</h3>
                <span id="transfer-mode-badge" class="transfer-badge">存入</span>
              </div>
              
              <div class="transfer-item-meta">
                <p id="transfer-item-usage" class="detail-type">普通素材</p>
                <p id="transfer-item-desc" class="detail-desc">散發微弱金屬光澤的粗糙礦石。</p>
                <p id="transfer-count-info" class="count-info">我的背包：5 個 | 工會倉庫：0 個</p>
              </div>
              
              <div class="stepper-controls-wrapper">
                <div class="stepper-controls">
                  <button type="button" id="popover-dec" class="stepper-btn" aria-label="Decrease quantity">-</button>
                  <span id="popover-value" class="stepper-val">1</span>
                  <button type="button" id="popover-inc" class="stepper-btn" aria-label="Increase quantity">+</button>
                  <button type="button" id="popover-max" class="stepper-btn max-btn" aria-label="Set to maximum">MAX</button>
                </div>
                <p class="stepper-limit-label" id="popover-limit-label">轉移範圍：1 ~ 5</p>
              </div>
              
              <div class="requirement-list" id="popover-requirement-list">
                <!-- Validation rows here -->
              </div>
              
              <button type="button" id="popover-confirm" class="primary-action transfer-execute-btn">確認轉移</button>
            </div>
          </section>
        </section>

        <!-- Warehouse Storage Column (10 Fixed Rows) -->
        <section class="list-browser storage-browser" aria-label="Warehouse list">
          <div class="column-heading">
            <h2>工會保管箱物品</h2>
          </div>
          <div class="item-list-container">
            <div class="item-list" id="storage-item-list">
              <!-- Rendered via JS as item rows (exactly 10 rows for capacity) -->
            </div>
          </div>
        </section>
      </main>

      <footer class="storage-footer">
        <div class="footer-left-action">
          <button id="back-action" class="secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
        </div>
        <section class="dialogue-box">
          <div class="speaker-name" id="feedback-speaker">系統提示</div>
          <div class="dialogue-content-area">
            <p id="feedback-message" class="speech-bubble">選擇左側背包物品 (存入) 或右側倉庫物品 (取出) 來進行轉移整理。</p>
          </div>
        </section>
        <div class="footer-right-action">
          <button id="primary-action" class="primary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 12H9v-2h6v2zm5-5H4V8h16v3z" fill="currentColor"/></svg>
            <span class="btn-text">解鎖倉庫</span>
          </button>
        </div>
      </footer>

      <!-- Collapsible UIAction Log Panel (Compact details footer) -->
      <details class="action-log-panel">
        <summary class="panel-label">UIAction Log</summary>
        <div class="action-log-heading">
          <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
        </div>
        <ol id="action-log" class="action-log"></ol>
      </details>
    </div>

    <script type="module" src="./storage-screen.js"></script>
  </body>
</html>
