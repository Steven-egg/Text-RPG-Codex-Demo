<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邊境工坊 - 《元素迷宮：邊境冒險者》</title>
  <link rel="stylesheet" href="styles.css">
  <!-- 引入 Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="facility-body">
  <div class="game-container">
    <!-- 頂部標頭與測試 Fixture 切換器 -->
    <header class="game-header">
      <div class="title-zone">
        <h1 class="main-title">邊境工坊</h1>
        <p class="subtitle">邊境工坊</p>
      </div>
      <div class="meta-zone">
        <div class="player-info">
          <span class="info-chip" id="player-name">---</span>
          <span class="info-chip" id="player-job">---</span>
          <span class="info-chip" id="player-gold">0G</span>
        </div>
        <div class="fixture-selector-container">
          <label for="fixture-select">測試 Fixture: </label>
          <select id="fixture-select">
            <option value="workshop-default.json">一般 (劍士 1500G 可購買/可強化)</option>
            <option value="workshop-constrained.json">受限 (法師 50G 金幣/材料不足/未解鎖)</option>
          </select>
        </div>
      </div>
    </header>

    <!-- 三欄主要操作區 -->
    <main class="main-stage">
      <!-- 左欄：分類 Tabs 與列表 -->
      <section class="left-column panel-border">
        <div class="tabs-deck">
          <button class="tab-btn active" data-category="weapon">
            <span class="tab-icon">⚔</span>
            <span class="tab-label">購買武器</span>
            <span class="tab-count" id="count-weapon">0</span>
          </button>
          <button class="tab-btn" data-category="armor">
            <span class="tab-icon">🛡</span>
            <span class="tab-label">購買防具</span>
            <span class="tab-count" id="count-armor">0</span>
          </button>
          <button class="tab-btn" data-category="upgrade">
            <span class="tab-icon">⚒</span>
            <span class="tab-label">裝備強化</span>
            <span class="tab-count" id="count-upgrade">0</span>
          </button>
          <button class="tab-btn" data-category="owned">
            <span class="tab-icon">🎒</span>
            <span class="tab-label">我的裝備</span>
            <span class="tab-count" id="count-owned">0</span>
          </button>
        </div>
        <div class="list-deck scrollable" id="item-list-container">
          <!-- 項目會動態由 JavaScript 填入 -->
        </div>
      </section>

      <!-- 中欄：品項詳情與需求缺口（雙面板） -->
      <section class="center-column">
        <!-- 上面板：詳情屬性與說明 -->
        <div class="detail-panel panel-border">
          <div class="panel-header">
            <span class="panel-title">品項詳情</span>
            <span class="category-tag" id="detail-slot">WEAPON</span>
          </div>
          <div class="detail-content" id="item-detail-view">
            <!-- 詳情會由 JavaScript 動態填入 -->
            <p class="placeholder-text">請選擇左側的品項查看詳情</p>
          </div>
        </div>

        <!-- 下面板：需求與消耗材料檢核 -->
        <div class="requirement-panel panel-border" id="requirement-box">
          <div class="panel-header">
            <span class="panel-title">需求與消耗</span>
          </div>
          <div class="requirement-content" id="item-requirement-view">
            <!-- 需求與材料缺口會由 JavaScript 動態填入 -->
            <p class="placeholder-text">請選擇左側品項以確認交易需求</p>
          </div>
        </div>
      </section>

      <!-- 右欄：NPC 形象與台詞區 -->
      <section class="right-column panel-border" id="npc-stage">
        <div class="npc-header">
          <span class="npc-badge" id="npc-role">工坊主</span>
          <span class="npc-name" id="npc-name">葛雷</span>
        </div>
        <!-- NPC 形象 Programmatic Silhouette -->
        <div class="npc-silhouette-area">
          <div class="npc-silhouette" id="npc-visual"></div>
        </div>
        <div class="dialog-bubble">
          <p class="dialog-text" id="npc-dialog">「伴隨著鐵錘敲擊砧台的節奏，這裡充滿了金屬與汗水的硬派氣息。」</p>
        </div>
      </section>
    </main>

    <!-- 底部動作控制與 NPC 提示列 -->
    <footer class="action-footer">
      <div class="footer-left">
        <button class="action-btn back-btn" id="back-to-town">
          <span class="btn-icon">↩</span> 返回城鎮
        </button>
      </div>
      <div class="footer-center panel-border">
        <p class="feedback-msg" id="feedback-bar">工坊設備已就緒，請選擇項目。</p>
      </div>
      <div class="footer-right">
        <button class="action-btn primary-btn" id="primary-action" disabled>
          選擇項目
        </button>
      </div>
    </footer>

    <!-- 除錯/調試用 UIAction Log 面板 -->
    <div class="debug-container panel-border">
      <div class="debug-header" id="debug-toggle">
        <span class="debug-title">UIAction Log (Prototype Debug)</span>
        <span class="debug-indicator">▼</span>
      </div>
      <div class="debug-content" id="debug-log-view">
        <!-- Action 日誌會輸出在此 -->
      </div>
    </div>
  </div>

  <script type="module" src="workshop-screen.js"></script>
</body>
</html>
