        // Web Audio API 提示音效系統
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playRpgSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'confirm') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1174.66, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 text-xs tracking-widest font-semibold transition-all duration-300 bg-gradient-to-r from-blue-950 to-indigo-950 text-blue-400 border border-blue-500/50 shadow-[0_0_10px_rgba(30,64,175,0.5)]";
            } else {

                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2 text-xs tracking-widest font-semibold transition-all duration-300 bg-gradient-to-r from-blue-950 to-indigo-950 text-blue-400 border border-blue-500/50 shadow-[0_0_10px_rgba(30,64,175,0.5)]";
            }

        function togglePasswordVisibility(inputId, btn) {
            playRpgSound('select');

            const eyeIcon = btn.querySelector('.eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>`;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }
        }

        function handleFormSubmit(event, mode) {
            event.preventDefault();
            playRpgSound('confirm');
            if (mode === 'login') {
                showNotification(`聖所門扉已開啟。歡迎回來，信使。`, 'success');
            } else {
                const name = document.getElementById('register-name').value;
                showNotification(`契約已立，靈魂名冊已更新。歡迎新信徒【${name}】。`, 'success');
            }
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'flex items-center p-4 min-w-[280px] bg-[#0d0f12]/95 border border-jrpggold text-slate-200 text-xs tracking-wider rounded-none shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto';
            let typeColor = 'border-l-4 border-l-blue-500';
            if (type === 'success') typeColor = 'border-l-4 border-l-emerald-500';

            toast.className += ` ${typeColor}`;
            toast.innerHTML = `
                <div class="font-medium mr-4">${message}</div>
                <button onclick="this.parentElement.remove()" class="ml-auto text-slate-500 hover:text-slate-300">✦</button>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }
    </script>
