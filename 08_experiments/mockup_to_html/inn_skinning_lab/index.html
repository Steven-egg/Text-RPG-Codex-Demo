<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>《元素迷宮：邊境冒險者》旅店</title>
    <link rel="stylesheet" href="./inn_skinning_lab.css" />
  </head>
  <body class="facility-body">
    <div class="inn-shell" data-load-state="loading">

      <!-- 頂部 JRPG HUD Bar -->
      <header class="hud-bar">
        <div class="hud-title-area">
          <div class="title-copy">
            <span class="panel-label">城鎮設施</span>
            <h1 id="screen-title" class="hud-location-name">旅店 (Ember Inn)</h1>
            <p id="screen-subtitle" class="hud-subtitle" style="display: none;"></p>
          </div>
        </div>

        <!-- HP, MP, Gold Resource Strip -->
        <div id="resource-strip" class="hud-resources" aria-label="Player Stats">
          <!-- Renders dynamically from JS: HP, MP, Gold -->
        </div>

        <div class="fixture-switcher-container" style="display: none;">
          <div class="fixture-switcher" aria-label="Fixture state">
            <label for="fixture-select">測試狀態</label>
            <select id="fixture-select">
              <option value="default">預設旅店狀態</option>
            </select>
          </div>
        </div>
      </header>

      <!-- 中間 JRPG 大舞台 (Main Stage) -->
      <main class="main-stage">
        <!-- 旅店溫暖光影 -->
        <div class="fireplace-glow"></div>
        <div class="ambient-light"></div>

        <!-- 旅館紅框內容隱藏以防 JS 報錯 -->
        <div style="display: none;">
          <!-- 左側欄：傳聞看板 (Rumors Board) -->
          <section class="rumors-board">
            <div id="rumors-container" class="rumors-list"></div>
          </section>

          <!-- 中間欄：休息服務卡 (Service Card) -->
          <section class="service-card">
            <h3 id="service-name">過夜休息</h3>
            <p id="service-description"></p>
            <strong id="service-cost">30 G</strong>
            <div id="npc-description"></div>
          </section>

          <!-- NPC 莉莉形象展示區 -->
          <div class="npc-stage-presence">
            <div id="npc-avatar">LY</div>
          </div>
        </div>
      </main>

      <!-- 底部 JRPG 對話與行動面板 -->
      <footer class="jrpg-footer-bar">
        <!-- 左側：次要行動按鈕區 -->
        <div class="footer-left-action">
          <button onclick="const hint = document.querySelector('.continue-hint'); if (hint) { hint.click(); } setTimeout(() => document.getElementById('back-to-town').click(), 10)" class="action-btn secondary-action" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M2 22h20v-2h-2v-4h-2v4h-4v-6h-4v6H6v-4H4v4H2v2zm3-8h2v-2H5v2zm12 0h2v-2h-2v2zM11 4.5l-5 5V12h10V9.5l-5-5z" fill="currentColor"/></svg>
            <span class="btn-text">返回城鎮</span>
          </button>
          <button id="back-to-town" style="display: none;" type="button"></button>
        </div>

        <!-- 中間：對話框 (Dialogue Box) -->
        <section class="dialogue-box">
          <div class="speaker-name" id="npc-name">莉莉</div>
          <div class="dialogue-content-area">
            <p id="npc-bubble" class="speech-bubble">Loading...</p>
            <p id="feedback-message" class="feedback-message"></p>

            <!-- 對話確認選項 (經典 JRPG 綠色邊框樣式) -->
            <div id="dialogue-choices" class="dialogue-choices" style="display: none;">
              <button id="choice-yes" class="choice-btn" type="button">是 (y)</button>
              <button id="choice-no" class="choice-btn" type="button">否 (n)</button>
            </div>
          </div>
          <div class="speech-arrow">▼</div>
        </section>

        <!-- 右側：主要行動按鈕區 -->
        <div class="footer-right-action">
          <button onclick="const hint = document.querySelector('.continue-hint'); if (hint) { hint.click(); } setTimeout(() => document.getElementById('confirm-rest-btn').click(), 10)" class="action-btn primary-action active" type="button">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z" fill="currentColor"/></svg>
            <span class="btn-text">過夜休息</span>
          </button>
          <button id="confirm-rest-btn" style="display: none;" type="button"></button>
        </div>
      </footer>

      <!-- Collapsible UIAction Log Panel for Verification (Hidden in production styling) -->
      <section class="action-log-panel" style="display: none;">
        <details>
          <summary class="action-log-heading">
            <span class="panel-label">UIAction 事件日誌 (Debug)</span>
            <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
          </summary>
          <ol id="action-log" class="action-log"></ol>
        </details>
      </section>
    </div>

    <script src="./fixtures.js"></script>
    <script src="./inn_skinning_lab.js"></script>
  </body>
</html>
