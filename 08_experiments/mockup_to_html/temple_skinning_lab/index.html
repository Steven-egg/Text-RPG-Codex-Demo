<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temple Static JRPG Prototype</title>
    <link rel="stylesheet" href="./temple_skinning_lab.css" />
  </head>
  <body>
    <div class="temple-shell" data-load-state="loading">

      <!-- 頂部 JRPG HUD Bar -->
      <header class="hud-bar">
        <div class="hud-title-area">
          <span class="insignia-icon">⛪</span>
          <div>
            <h1 id="screen-title" class="hud-location-name">Loading...</h1>
            <p id="screen-subtitle" class="hud-subtitle"></p>
          </div>
        </div>

        <!-- 隱藏的舊 HP, MP, Gold Resource Strip，保持 JS 向下相容 -->
        <div id="resource-strip" style="display: none;" aria-hidden="true"></div>

        <div class="fixture-switcher-container">
          <div class="fixture-switcher" aria-label="Fixture state">
            <label for="fixture-select">測試狀態</label>
            <select id="fixture-select">
              <option value="default">Default Temple</option>
            </select>
          </div>
        </div>
      </header>

      <!-- 中間 JRPG 大舞台 (Main Stage) -->
      <main class="main-stage">
        <!-- 教堂神聖光影 -->
        <div class="church-glow"></div>
        <div class="stained-glass-light"></div>

        <!-- NPC 艾莉希亞形象展示區 (NPC Presence Anchor) -->
        <div class="npc-stage-presence">
          <div class="npc-portrait-container">
            <div class="npc-avatar-plate">EL</div>
            <div class="npc-silhouette">🧎‍♀️</div>
            <div class="npc-glow"></div>
          </div>
        </div>
      </main>

      <!-- 底部 JRPG 對話與行動面板 -->
      <footer class="jrpg-footer-bar">
        <!-- 左側：對話框 (Dialogue Box) -->
        <section class="dialogue-box">
          <div class="speaker-name" id="npc-name">艾莉希亞</div>
          <div class="dialogue-content-area">
            <p id="npc-bubble" class="speech-bubble">願聖光指引你的道路，旅人。需要教會的協助嗎？</p>
            <p id="feedback-message" class="feedback-message"></p>

            <!-- 隱藏的舊 DOM 佔位符以防 JS 报错 -->
            <div style="display:none;" id="well-name"></div>
            <div style="display:none;" id="well-description"></div>
            <div style="display:none;" id="well-feedback"></div>
            <div style="display:none;" id="inquiries-container"></div>
            <div style="display:none;" id="inquiry-feedback"></div>
            <button style="display:none;" id="draw-wellwater-btn" type="button"></button>
          </div>
          <div class="speech-arrow">▼</div>
        </section>

        <!-- 右側：行動選單 (Action Menu) -->
        <section class="action-menu">
          <button id="open-inquiries-btn" class="action-btn active" type="button">
            <span class="btn-icon">📜</span>
            <span class="btn-text">詢問關於主線與聖痕</span>
          </button>
          <button id="open-promotions-btn" class="action-btn" type="button">
            <span class="btn-icon">⚔️</span>
            <span class="btn-text">轉職預覽與引導</span>
          </button>
          <button id="back-to-town" class="action-btn" type="button">
            <span class="btn-icon">🏰</span>
            <span class="btn-text">返回城鎮</span>
          </button>
        </section>
      </footer>

      <!-- 彈窗對話框 2：轉職祭壇預覽 (Promotions Modal) - 保留並維護 -->
      <div id="promotions-modal" class="jrpg-modal-overlay" style="display: none;">
        <div class="jrpg-modal-content">
          <header class="modal-header">
            <h2>職業晉升祭壇 (預覽)</h2>
            <button id="close-promotions-btn" class="close-btn" type="button" aria-label="Close">×</button>
          </header>
          <div class="modal-body">
            <p class="modal-instruction">晉升二階職業將解鎖強大技能與全新屬性特化（目前僅供預覽）。</p>
            <div id="promotions-container" class="promotions-list">
              <!-- Renders promotion cards dynamically from JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Collapsible UIAction Log Panel for Verification -->
      <section class="action-log-panel">
        <details>
          <summary class="action-log-heading">
            <span class="panel-label">UIAction Log (Debug)</span>
            <button id="clear-log" class="quiet-button" type="button" aria-label="Clear log">清除</button>
          </summary>
          <ol id="action-log" class="action-log"></ol>
        </details>
      </section>
    </div>

    <script src="./fixtures.js"></script>
    <script src="./temple_skinning_lab.js"></script>
  </body>
</html>
